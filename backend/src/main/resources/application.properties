# ══════════════════════════════════════════════════════════════
#  CampusOS — Application Configuration
#  NEVER hardcode secrets here. Use environment variables.
#  Set these in your shell or a .env file (never commit secrets).
# ══════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── MySQL DataSource ─────────────────────────────────────────
# Override DB_URL, DB_USERNAME, DB_PASSWORD with env vars in production.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusos}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pvnrtemcc@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# update → Hibernate auto-creates/updates tables from entities.
# NEVER use "update" or "create" in production — use Flyway/Liquibase instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ──────────────────────────────────────────────────────
# IMPORTANT: Set JWT_SECRET as an environment variable (min 256-bit / 32 chars).
# Example (PowerShell): $env:JWT_SECRET="my-very-secret-key-change-this-in-prod"
app.jwt.secret=${JWT_SECRET:campus-os-default-secret-key-please-change-in-production-minimum-256-bits}
# Token validity: 24 hours in milliseconds
app.jwt.expiration-ms=86400000

# ── Actuator ─────────────────────────────────────────────────
# Expose only the health endpoint publicly
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Swagger / OpenAPI ────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Logging ──────────────────────────────────────────────────
logging.level.com.campusos=DEBUG
logging.level.org.springframework.security=INFO
